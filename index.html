<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>球隊例賽報名</title>
<meta name="theme-color" content="#14532d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="意象太極">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="例賽報名">
<link rel="preconnect" href="https://static.line-scdn.net" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
<style>
  :root{
    --fairway:#14532d; --fairway-2:#2d6a4f; --green-soft:#e7efe6;
    --paper:#f7f4ec; --paper-2:#fffdf7; --ink:#1d211c; --ink-soft:#5a6157;
    --line:#d9d6c8; --flag:#bc4b3c; --gold:#b08534;
    --shadow:0 1px 2px rgba(20,30,20,.06),0 8px 24px rgba(20,30,20,.07);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    color:var(--ink); font-size:18.5px; line-height:1.55; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:540px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom));}   /* 頂部避開 iPhone 瀏海/動態島 */
  .center{text-align:center;color:var(--ink-soft);padding:70px 20px;}
  .spinner{width:34px;height:34px;border:3px solid var(--green-soft);border-top-color:var(--fairway-2);border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── 太極載入畫面(全屏流動 · 淺色底) ── */
  .taiji-load{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
              background:radial-gradient(circle at 50% 40%,#f5f1e6,#e9e2d3);overflow:hidden}
  .tl-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .tl-glow{position:absolute;border-radius:50%;filter:blur(42px);mix-blend-mode:multiply}
  .tl-g1{width:60vw;height:60vw;left:-14vw;top:-10vh;background:radial-gradient(circle,rgba(45,106,79,.22),transparent 70%);animation:tlf1 15s ease-in-out infinite}
  .tl-g2{width:54vw;height:54vw;right:-12vw;top:18vh;background:radial-gradient(circle,rgba(45,106,79,.20),transparent 70%);animation:tlf2 18s ease-in-out infinite}
  .tl-g3{width:64vw;height:64vw;left:8vw;bottom:-20vh;background:radial-gradient(circle,rgba(130,165,120,.22),transparent 70%);animation:tlf3 20s ease-in-out infinite}
  .tl-g4{width:40vw;height:40vw;right:6vw;bottom:6vh;background:radial-gradient(circle,rgba(190,150,70,.14),transparent 70%);animation:tlf1 22s ease-in-out infinite reverse}
  @keyframes tlf1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,4vh) scale(1.12)}}
  @keyframes tlf2{0%,100%{transform:translate(0,0) scale(1.05)}50%{transform:translate(-5vw,5vh) scale(.92)}}
  @keyframes tlf3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4vw,-5vh) scale(1.1)}}
  .tl-field{position:absolute;inset:-20%;pointer-events:none;animation:spin 60s linear infinite}
  .tl-field circle{fill:none;stroke-linecap:round}
  .tl-arcA{stroke:rgba(45,106,79,.22);stroke-width:2;stroke-dasharray:120 700;animation:tldA 9s linear infinite}
  .tl-arcB{stroke:rgba(176,133,52,.22);stroke-width:1.6;stroke-dasharray:60 520;animation:tldB 12s linear infinite}
  .tl-arcC{stroke:rgba(20,83,45,.20);stroke-width:1.4;stroke-dasharray:30 380;animation:tldA 16s linear infinite reverse}
  @keyframes tldA{to{stroke-dashoffset:-820}}
  @keyframes tldB{to{stroke-dashoffset:-580}}
  .tl-parts{position:absolute;inset:0;pointer-events:none}
  .tl-parts i{position:absolute;bottom:-12px;width:6px;height:6px;border-radius:50%;background:rgba(45,106,79,.5);animation:tlrise linear infinite}
  @keyframes tlrise{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.8}90%{opacity:.7}100%{transform:translateY(-112vh) translateX(6vw);opacity:0}}
  .tl-stage{position:relative;z-index:2;width:100px;height:100px;display:flex;align-items:center;justify-content:center}
  .tl-halo{position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle,rgba(45,106,79,.20),transparent 66%);animation:tlbreathe 4.6s ease-in-out infinite}
  @keyframes tlbreathe{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.1);opacity:1}}
  .tl-logo{position:relative;width:66px;height:auto;transform-origin:50% 82%;animation:tlqi 4.6s ease-in-out infinite;filter:drop-shadow(0 3px 7px rgba(20,83,45,.3))}
  @keyframes tlqi{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.02)}100%{transform:translateY(0) scale(1)}}
  .tl-txt{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;gap:6px}
  .tl-title{font-size:17.5px;letter-spacing:.1em;color:var(--fairway);font-weight:700}
  .tl-sub{font-size:13.5px;letter-spacing:.26em;color:var(--green-2);opacity:.85}
  .tl-dots{position:relative;z-index:2;display:flex;gap:6px}
  .tl-dots i{width:7px;height:7px;border-radius:50%;background:var(--green-2);opacity:.35;animation:tlblink 1.4s infinite}
  .tl-dots i:nth-child(2){animation-delay:.2s}.tl-dots i:nth-child(3){animation-delay:.4s}
  @keyframes tlblink{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
  @media (prefers-reduced-motion:reduce){.taiji-load *{animation:none!important}}

  .card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .masthead{background:linear-gradient(160deg,var(--fairway),var(--fairway-2));color:#f4f7f0;padding:20px 20px 22px;position:relative}   /* safe-area 改由 .wrap 統一處理,避免重複留白 */
  .masthead .flag{position:absolute;top:16px;right:18px;width:30px;height:30px}
  .eyebrow{font-size:14.5px;letter-spacing:.18em;text-transform:uppercase;color:#b9d3c0;margin:0 0 6px}
  .title{font-family:Georgia,"Times New Roman","Noto Serif TC",serif;font-size:30px;font-weight:700;margin:0;line-height:1.25}
  .title-zh{font-size:21px;font-weight:600;margin:4px 0 0;color:#dce8df}

  .meta{padding:6px 20px 14px}
  .meta-row{display:flex;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid #efece0}
  .meta-row:last-child{border-bottom:0}
  .meta-k{flex:0 0 60px;font-size:16px;color:var(--ink-soft);letter-spacing:.04em}
  .meta-v{flex:1;font-size:19px;font-weight:600}
  .meta-v.fee{color:var(--fairway-2)}
  .meta-v.tee{color:var(--flag)}

  .countstrip{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin:16px 0}
  /* 首屏合併版:2欄資訊列(對齊 meta-k 寬)、統計併卡底、你的出席合併卡 */
  .meta2{display:grid;grid-template-columns:1fr 1fr}
  .meta2 .meta-row{border-bottom:1px solid #efece0}
  .meta2 .meta-k{flex:0 0 60px}
  .cardstat{display:flex;border-top:1px solid var(--line);background:var(--green-soft)}
  .cardstat .cs{flex:1;text-align:center;padding:10px 4px}
  .cardstat b{font-size:26px;font-family:Georgia,serif;color:var(--fairway);line-height:1;display:block}
  .cardstat span{display:block;font-size:14px;color:var(--ink-soft);margin-top:2px}
  .cardstat .cs+.cs{border-left:1px solid #d3e0d3}
  .mypanel{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin:14px 0}
  .mypanel .myhead{display:flex;align-items:center;gap:10px;background:var(--green-soft);padding:10px 12px;border-bottom:1px solid #d8e4da}
  .mypanel .myhead .who{min-width:0}.mypanel .myhead .who b{font-size:20.5px}.mypanel .myhead .who small{font-size:16px;color:var(--ink-soft)}
  .mypanel .myhead .badge{margin-left:auto}
  .mypanel .mybody{padding:13px 14px}
  .btn small{display:block;font-size:12.5px;font-weight:400;color:var(--ink-soft);margin-top:2px;line-height:1.2}
  .annadd{background:#f2f8f3;border:1px solid #cfe6d5;border-radius:12px;padding:11px 12px;margin-bottom:14px}
  .annadd textarea{width:100%;box-sizing:border-box;border:1px solid #cfd8df;border-radius:9px;padding:7px 9px;font:inherit;resize:vertical}
  .anncard{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:10px}
  .anncard.top{border-color:#c3ddc8;box-shadow:0 1px 5px rgba(45,106,79,.1)}
  .annhd{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .anndate{font-weight:700;color:var(--green-2);font-size:15.5px}
  .annnew{background:var(--flag);color:#fff;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;letter-spacing:.05em}
  .annDel{margin-left:auto;background:none;border:1px solid #e0cfc9;color:var(--flag);font-size:13.5px;border-radius:7px;padding:2px 10px}
  .annbody{font-size:17px;line-height:1.65;color:var(--ink);word-break:break-word}
  .annbody a{color:#2d6a4f;text-decoration:underline}
  .annevt{background:#fff6ec;border:1px solid #f0d3ac;border-radius:12px;padding:11px 12px;margin-top:16px}
  .annevt-h{font-weight:700;color:#a5631f;font-size:16px;margin-bottom:6px}
  .annevt-h small{display:block;font-weight:400;color:var(--ink-soft);font-size:13.5px;margin-top:1px}
  .annevt textarea{width:100%;box-sizing:border-box;border:1px solid #e6cba0;border-radius:9px;padding:8px 10px;font:inherit;resize:vertical}
  /* 採購紀錄 */
  .pur-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .pur-h .pur-date{color:var(--ink-soft);font-size:15.5px}
  .purhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--green-soft);border-radius:10px;padding:9px 12px}
  .purhead .ph-item{display:flex;align-items:center;gap:6px;font-size:15.5px}
  .purhead .ph-k{color:var(--ink-soft)}
  .purhead .ph-v{font-family:Georgia,serif;font-size:21.5px;color:var(--fairway)}
  .purhead .ph-buf{width:52px;text-align:center;border:1px solid var(--line);border-radius:7px;padding:5px 4px;font-size:16.5px;background:#fff}
  .purtab{border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .purhd,.purrow{display:grid;grid-template-columns:64px 1fr 56px 66px 30px 26px;gap:5px;align-items:center;padding:6px 6px}
  .purhd{background:var(--green-soft);font-size:13.5px;color:var(--ink-soft);grid-template-columns:64px 1fr 56px 66px 56px}
  .purrow{border-top:1px solid #eee}
  .purrow select,.purrow input[type=text],.purrow .pr-item,.purrow .pr-qty,.purrow .pr-amt{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:7px;padding:6px 4px;font-size:15px;background:var(--paper-2)}
  .purrow .pr-cat{padding:6px 2px}
  .purrow .pr-amt{text-align:right;font-weight:600;color:var(--fairway)}
  .purrow .pr-claim{width:18px;height:18px;justify-self:center}
  .purrow .pr-del{background:none;border:none;color:var(--flag);font-size:15.5px;cursor:pointer;padding:0}
  .purtot{margin-top:10px;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .pt-row{display:flex;justify-content:space-between;font-size:16.5px;padding:3px 0}
  .pt-row b{font-family:Georgia,serif}
  .pt-claimed{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:16px;font-weight:600}
  .pt-claimed input{width:18px;height:18px}
  .monthbox{border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .mrow{display:grid;grid-template-columns:48px 1fr 44px 60px 44px;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid #eee;font-size:15.5px}
  .mrow:first-child{border-top:none}
  .mrow .mcat{font-size:12.5px;color:#fff;background:var(--green-2);border-radius:5px;text-align:center;padding:2px 0}
  .mrow .mitem{font-weight:600}
  .mrow .mqty{color:var(--ink-soft);font-size:14.5px}
  .mrow .msum{font-family:Georgia,serif;font-weight:700;color:var(--fairway);text-align:right}
  .mrow .mtimes{font-size:13.5px;color:var(--ink-soft);text-align:right}
  .mrow.mtotal{background:var(--green-soft);font-weight:700}
  .mrow.mtotal .msum{font-size:16.5px}
  /* 財務長帳務 */
  .led-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .led-top select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:16.5px;background:var(--paper-2)}
  .led-card{border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .lrow{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-top:1px solid #eee;font-size:16.5px}
  .lrow:first-child{border-top:none}
  .lrow span small{color:var(--ink-soft);font-size:12.5px;font-weight:400;margin-left:4px}
  .lrow b{font-family:Georgia,serif;font-size:18.5px}
  .lrow.lhead{background:var(--green-soft)}
  .lrow.lhead b{color:var(--fairway)}
  .lrow .lout{color:var(--flag)}
  .lrow.lin input{width:110px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:16.5px;background:#fff}
  .lsub{padding:6px 14px;font-size:13.5px;color:var(--ink-soft);background:#faf8f2;letter-spacing:.1em}
  .lrow.ltot{background:#faf8f2;font-weight:700}
  .lrow.lbal{background:var(--fairway);color:#fff}
  .lrow.lbal b{color:#fff;font-size:21.5px}
  /* 逐月支出總表 */
  .lgtbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
  .lgtbl{border-collapse:collapse;width:100%;font-size:14.5px;min-width:340px}
  .lgtbl th,.lgtbl td{padding:8px 9px;text-align:right;white-space:nowrap;border-top:1px solid #eee}
  .lgtbl thead th{background:var(--green-soft);color:var(--fairway);font-weight:700;border-top:none}
  .lgtbl tbody th{text-align:left;color:var(--ink);font-weight:700;background:#faf8f2}
  .lgtbl td{font-family:Georgia,serif}
  .lgtbl td.ex{color:var(--flag);font-weight:700}
  .lgtbl .z{color:var(--ink-soft)}
  .lgtbl tr.tf th,.lgtbl tr.tf td{background:#faf8f2;font-weight:700;border-top:2px solid var(--line)}
  .lgtbl tr.tf td.ex{color:var(--flag)}
  .lgtbl .itn{display:block;font-style:normal;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;font-size:11.5px;color:var(--ink-soft);white-space:normal;max-width:120px;margin-left:auto;line-height:1.4}
  .lgtbl td.bal{font-weight:700;color:var(--fairway)}
  .lgtop{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;margin-bottom:10px;border:1px solid var(--line);border-radius:10px;background:var(--green-soft);font-size:15.5px}
  .lgtop b{font-family:Georgia,serif;font-size:18.5px;color:var(--fairway)}
  /* 加碼獎 */
  .smtabs{display:flex;gap:6px;margin:12px 0 12px;border-bottom:2px solid var(--line);padding-bottom:0}
  .smtab,.ledtab{background:none;border:none;border-bottom:3px solid transparent;padding:8px 12px;font-size:16px;font-weight:700;color:var(--ink-soft);cursor:pointer;margin-bottom:-2px}
  .smtab.on,.ledtab.on{color:var(--fairway);border-bottom-color:var(--fairway)}
  .smpane.hidden,.ledpane.hidden{display:none}
  .adnrow{border:1px solid var(--line);border-radius:10px;padding:8px 9px;margin-bottom:8px;background:var(--paper-2)}
  .adnrow .adn-l1{display:flex;gap:6px;align-items:center}
  .adnrow .adn-l1 .adn-award{flex:1;min-width:0}
  .adnrow .adn-l1 .adn-name{flex:0 0 92px}
  .adnrow .adn-l2{display:flex;gap:12px;align-items:center;margin-top:7px;flex-wrap:wrap}
  .adnrow .adn-l2 label{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--ink-soft)}
  .adnrow input:not([type=checkbox]){box-sizing:border-box;border:1px solid var(--line);border-radius:7px;padding:7px 8px;font-size:15.5px;background:#fff}
  .adnrow .adn-amt{width:82px;text-align:right;font-weight:600;color:var(--fairway)}
  .adnrow .adn-payer{width:82px}
  .adnrow .adn-team{font-weight:600}
  .adnrow .adn-teamck{width:17px;height:17px}
  .adnrow .adn-del{background:none;border:none;color:var(--flag);font-size:16.5px;cursor:pointer;padding:0 2px;flex:0 0 auto}
  .adntot{text-align:right;font-size:14.5px;color:var(--ink-soft);margin:6px 2px}
  .addonsec .adnsum{font-weight:700;font-size:16.5px;display:flex;align-items:baseline;gap:8px}
  .addonsec .adnsum small{color:var(--ink-soft);font-weight:400;font-size:14px}
  .adntot b{color:var(--fairway);font-family:Georgia,serif}
  .lightbox{position:fixed;inset:0;z-index:70;background:rgba(20,30,20,.5);display:flex;align-items:center;justify-content:center;padding:16px}
  .lightbox.hidden{display:none}
  .lbcard{background:var(--paper-2);border-radius:14px;max-width:420px;width:100%;max-height:85vh;overflow:auto;padding:16px}
  .lbhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .lbhd b{font-size:18.5px}
  .lbx{background:none;border:none;font-size:20.5px;color:var(--ink-soft);cursor:pointer}
  .hpset{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--green-soft);border-radius:10px;padding:10px;margin-bottom:10px;font-size:14.5px}
  .hpset input[type=text],.hpset input:not([type=checkbox]){border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:15.5px}
  .hp-teamck{display:flex;align-items:center;gap:4px}
  .hprow{display:flex;align-items:center;gap:10px;padding:4px 0}
  .hprow .hpn{flex:0 0 60px;font-size:14.5px;color:var(--ink-soft)}
  .hprow .hp-name{flex:1;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:15.5px}
  .mbadd{border:1px dashed #cfe0d2;border-radius:11px;padding:9px 12px;background:#f4f8f4}
  .mbadd>summary{cursor:pointer;list-style:none;font-weight:700;color:var(--fairway);font-size:16px}
  .mbadd>summary::-webkit-details-marker{display:none}
  .mbcard{border:1px solid var(--line);border-radius:11px;margin-bottom:8px;background:var(--paper-2);overflow:hidden}
  .mbcard.unb{border-color:#e3c8b8}
  .mbcard>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:11px 12px}
  .mbcard>summary::-webkit-details-marker{display:none}
  .mbcard>summary b{font-size:17px}
  .mbcard>summary small{color:var(--ink-soft);font-size:14px}
  .mbtag{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:2px 8px}
  .mbtag.ok{background:var(--green-soft);color:var(--fairway)}
  .mbtag.no{background:#fdecea;color:#b3382c}
  .mbbody{padding:2px 12px 12px;border-top:1px solid #efece0}
  .mbinfo{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--ink-soft);margin-top:8px}
  .mbinfo b{color:var(--ink)} .mbinfo b.ok{color:var(--fairway)} .mbinfo b.no{color:var(--flag)}
  .mbtag.off{background:#eceae4;color:#8a8676}
  .mbcard.off{opacity:.72}
  .mbchips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
  .mbchip{background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:14px;color:var(--ink-soft);cursor:pointer}
  .mbchip b{color:var(--fairway);font-family:Georgia,serif;margin-left:2px}
  .mbchip.on{background:var(--fairway);border-color:var(--fairway);color:#fff}
  .mbchip.on b{color:#ffd98a}
  .mbov{border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:var(--paper-2);margin-bottom:10px}

<body>
<div class="wrap" id="app">
  <div class="taiji-load" id="taijiLoad">
    <div class="tl-bg"><div class="tl-glow tl-g1"></div><div class="tl-glow tl-g2"></div><div class="tl-glow tl-g3"></div><div class="tl-glow tl-g4"></div></div>
    <svg class="tl-field" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice"><circle class="tl-arcA" cx="200" cy="200" r="185"/><circle class="tl-arcB" cx="200" cy="200" r="150"/><circle class="tl-arcC" cx="200" cy="200" r="120"/><circle class="tl-arcB" cx="200" cy="200" r="90"/></svg>
    <div class="tl-parts"><i style="left:12%;animation-duration:11s"></i><i style="left:26%;animation-duration:14s;animation-delay:2s;width:4px;height:4px"></i><i style="left:40%;animation-duration:9s;animation-delay:1s"></i><i style="left:55%;animation-duration:13s;animation-delay:3s;width:5px;height:5px"></i><i style="left:68%;animation-duration:10s;animation-delay:.5s"></i><i style="left:82%;animation-duration:15s;animation-delay:2.5s;width:4px;height:4px"></i><i style="left:92%;animation-duration:12s;animation-delay:1.5s"></i></div>
    <div class="tl-stage"><div class="tl-halo"></div><img class="tl-logo" alt="意象太極" src="icon-192.png"></div>
    <div class="tl-txt"><div class="tl-title">意象太極高爾夫球隊</div><div class="tl-sub">載入中</div></div>
    <div class="tl-dots"><i></i><i></i><i></i></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   設定區 — 部署時把這兩個值換成你自己的
   ============================================================ */
var LIFF_ID = "2010396373-bdFy7e3d";
var GAS_URL = "https://script.google.com/macros/s/AKfycbwwU9v8uVEIhg8hgBtU053D5sMIXW-9cFJBYl48K7Cps9_p6IQ89SQrH91-jMuBPpQa/exec";
/* ============================================================ */

var app = document.getElementById("app");
var profile = null;     // {userId, displayName, pictureUrl}
var ID_TOKEN = '';      // LINE ID Token(寫入動作驗證用)
var state = null;       // bootstrap 回傳

// ---- JSONP:用 <script> 載入,避開 CORS ----
function api(params){
  return new Promise(function(resolve, reject){
    var cb = "cb_" + Date.now() + "_" + Math.floor(Math.random()*1e6);
    var timer = setTimeout(function(){ cleanup(); resolve({ok:false, error:"連線逾時,請確認網路後再試一次"}); }, 20000);
    window[cb] = function(data){ clearTimeout(timer); cleanup(); resolve(data); };
    function cleanup(){ delete window[cb]; if(s.parentNode) s.parentNode.removeChild(s); }
    var qs = Object.keys(params).map(function(k){
      var v=params[k];
      if(v!==null && typeof v==="object") v=JSON.stringify(v);   // 陣列/物件 → JSON,避免被轉成 "[object Object]"
      return encodeURIComponent(k)+"="+encodeURIComponent(v);
    }).join("&");
    if(ID_TOKEN) qs += "&idToken=" + encodeURIComponent(ID_TOKEN);
    var s = document.createElement("script");
    s.src = GAS_URL + "?" + qs + "&callback=" + cb;
    s.onerror = function(){ clearTimeout(timer); cleanup(); resolve({ok:false, error:"無法連線到伺服器,請稍後再試"}); };
    document.body.appendChild(s);
  });
}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function capNum(){var n=parseInt((state.eventView&&state.eventView.cap)||state.event.cap,10);return isNaN(n)?0:n;}
function myRow(){return state.roster.filter(function(p){return p.userId===profile.userId;})[0]||null;}

// ---- 啟動 ----
var previewMember=false;
// 給 Promise 加逾時(LINE 端點偶發卡死時不再無限等)
function withTimeout_(p,ms){ return Promise.race([p,new Promise(function(_,rej){ setTimeout(function(){ rej(new Error("timeout")); },ms); })]); }
(async function init(){
  // 載入畫面看門狗:8 秒還沒畫出任何畫面 → 顯示「連線比平常久」+ 重新載入鈕(不再讓人對著隊徽乾等)
  setTimeout(function(){
    if(window.__rendered) return;
    var sub=document.querySelector(".tl-sub"); if(sub) sub.textContent="連線比平常久…";
    var dots=document.querySelector(".tl-dots");
    if(dots && !document.getElementById("slowRetry")){
      var b=document.createElement("button"); b.id="slowRetry"; b.textContent="重新載入";
      b.style.cssText="margin-top:14px;padding:8px 22px;border:1px solid #2d6a4f;background:#fff;color:#14532d;border-radius:10px;font-size:15px";
      b.onclick=function(){ location.reload(); };
      dots.parentNode.appendChild(b);
    }
  },8000);
  // ① 提早暖機:用上次存的 userId,在 liff.init「之前」就平行送出 bootstrap。
  //    重複登入時,GAS 冷啟動會與 LIFF 初始化同時進行,不必先等 LIFF 再等資料。
  var cachedUid=""; try{ cachedUid=localStorage.getItem("liff_uid")||""; }catch(e){}
  var pWarm = cachedUid ? api({ action:"bootstrap", userId:cachedUid, asMember:"" }) : null;

  // ①-2 快照秒開:上次成功畫面直接先畫(0 等待),背景抓最新、抓到後無感刷新
  var snapRendered=false;
  if(cachedUid && !previewMember){
    try{
      var snap=JSON.parse(localStorage.getItem("boot_snap")||"null");
      if(snap && snap.uid===cachedUid && snap.state && snap.state.ok){
        profile = snap.profile || { userId:cachedUid, displayName:"", pictureUrl:"" };
        state = snap.state;
        render(); snapRendered=true;
      }
    }catch(e){}
  }

  // LIFF SDK 改 defer 載入(不再擋首屏/快照秒開);這裡等它就緒,LINE CDN 卡住也有逾時
  try{
    await withTimeout_(new Promise(function(res){
      var chk=function(){ if(window.liff) return res(); setTimeout(chk,40); };
      chk();
    }), 12000);
  }catch(e){
    if(snapRendered){ toast("⚠ LINE 元件載入失敗,顯示上次資料"); return; }
    return fatal("LINE 元件載入逾時,請檢查網路後點下方重新載入。");
  }
  try{
    await withTimeout_(liff.init({ liffId: LIFF_ID }), 12000);   // LINE 初始化最多等 12 秒
  }catch(e){
    if(snapRendered){ toast("⚠ LINE 連線異常,顯示上次資料"); return; }
    return fatal(String(e&&e.message)==="timeout" ? "LINE 連線逾時,請檢查網路後點下方重新載入。" : "LIFF 初始化失敗,請確認 LIFF_ID 設定正確。");
  }
  if(!liff.isLoggedIn()){ liff.login(); return; }   // 外部瀏覽器會導向 LINE 登入

  try{ ID_TOKEN = liff.getIDToken() || ""; }catch(e){ ID_TOKEN = ""; }   // 寫入動作驗證用(需頻道開啟 openid scope)

  var ctx=null; try{ ctx=liff.getContext(); }catch(e){}
  var uid = ctx && ctx.userId;
  // ② 首次或未命中暖機時,用 getContext 的 uid 盡早起跑 bootstrap(與「取個人資料」平行)
  var pBootCtx = (!pWarm && uid) ? api({ action:"bootstrap", userId:uid, asMember: previewMember?"1":"" }) : null;

  var pProfile = withTimeout_(liff.getProfile(), 10000).catch(function(){ return null; });   // 取個人資料最多等 10 秒,拿不到走 uid 備援
  profile = await pProfile || profile;
  if(!profile){
    if(uid){ profile = { userId:uid, displayName:"", pictureUrl:"" }; }   // 拿不到 profile 但有 uid,仍可運作
    else { return fatal("無法取得 LINE 個人資料,請重新開啟。"); }
  }
  try{ localStorage.setItem("liff_uid", profile.userId); }catch(e){}   // 存起來,下次提早暖機用

  try{
    // ③ 挑選正確使用者的那一趟 bootstrap:優先重用已平行跑的暖機/起跑趟,否則現在才抓
    var pBoot;
    if(pWarm && cachedUid === profile.userId)        pBoot = pWarm;       // 重用暖機那趟(最快)
    else if(pBootCtx && uid === profile.userId)       pBoot = pBootCtx;    // 重用 getContext 起跑那趟
    else  pBoot = api({ action:"bootstrap", userId: profile.userId, asMember: previewMember?"1":"" });
    var fresh = await pBoot;
    if(!fresh || !fresh.ok){
      if(snapRendered){ toast("⚠ 連線失敗,顯示上次資料"); return; }
      return fatal((fresh&&fresh.error) || "讀取失敗");
    }
    state = fresh;
    render();
    saveSnap();
    loadMyStats();
  }catch(e){
    if(snapRendered){ toast("⚠ 連線失敗,顯示上次資料"); return; }
    fatal(e.message || "連線失敗,請確認 GAS_URL 設定並稍後再試。");
  }
})();

// 存快照(登入秒開用):成功畫面 + 基本個人資料;過大或失敗就略過
function saveSnap(){
  if(previewMember) return;
  try{
    var s=JSON.stringify({ uid: profile.userId,
      profile: { userId: profile.userId, displayName: profile.displayName||"", pictureUrl: profile.pictureUrl||"" },
      state: state });
    if(s.length < 900000) localStorage.setItem("boot_snap", s);
  }catch(e){}
}

// ===== 功能頁快照:打開先顯示上次資料(0 等待),背景默默抓最新;失敗不再無聲卡「載入中」 =====
var TILE_API={
  purchase:{action:"getPurchase", key:"purchase",    flag:"__purLoading",   when:function(){return state&&state.isAdmin;}},
  ledger:  {action:"getLedger",   key:"ledger",      flag:"__ledLoading",   when:function(){return state&&(state.isTreasurer||state.isAdmin||state.isPresident);},
            params:function(){ return (state.ledger&&state.ledger.selMonth)?{month:state.ledger.selMonth}:{}; }},   // 背景更新維持正在看的月份
  members: {action:"memberAdmin", key:"memberAdmin", flag:"__mbLoading",    when:function(){return state&&state.isAdmin;}},
  score:   {action:"getAddon",    key:"addon",       flag:"__addonLoading", when:function(){return state&&state.isAdmin;}}
};
function tileSnapGet(key){
  try{
    var s=JSON.parse(localStorage.getItem("tile_snap_"+key)||"null");
    if(s && s.uid===profile.userId && s.data) return s.data;
  }catch(e){}
  return null;
}
function tileSnapPut(key,data){
  if(previewMember) return;
  try{
    var s=JSON.stringify({uid:profile.userId,t:Date.now(),data:data});
    if(s.length<400000) localStorage.setItem("tile_snap_"+key,s);
  }catch(e){}
}
// 寫入後的連動一致性:成功回傳新資料 → 同步快照;受影響的其他頁 → 清記憶體+快照,下次打開直接抓最新(不再閃舊數字)
function tileSnapDel(){ for(var i=0;i<arguments.length;i++){ try{ localStorage.removeItem("tile_snap_"+arguments[i]); }catch(e){} } }
function invalidateAdminData(){ state.__adminLoaded=false; state.__adminSnapUsed=false; tileSnapDel("adminData"); }
// 打開功能頁:記憶體沒資料→先畫上次快照;一律背景抓最新;失敗時「有舊資料→toast 提示、全無資料→頁內錯誤+重試鈕」
function openTileData(tm){
  var c=TILE_API[tm]; if(!c || !c.when()) return;
  state.__tileErr=state.__tileErr||{}; state.__tileStale=state.__tileStale||{};
  delete state.__tileErr[c.key];
  if(!state[c.key]){
    var snap=tileSnapGet(c.key);
    if(snap){ state[c.key]=snap; state.__tileStale[c.key]=true; renderMain(); }
  }
  if(state[c.flag]) return;                       // 已有一趟在跑,不重複
  state[c.flag]=true;
  var q={action:c.action,userId:profile.userId};
  if(c.params){ var px=c.params(); for(var k in px) q[k]=px[k]; }
  api(q).then(function(r){
    state[c.flag]=false;
    if(r&&r.ok){
      state[c.key]=r; delete state.__tileStale[c.key]; tileSnapPut(c.key,r); renderMain();
    }else{
      var msg=(r&&r.error)||"連線失敗";
      delete state.__tileStale[c.key];
      if(state[c.key]){ toast("⚠ 更新失敗,先顯示上次資料("+msg+")"); renderMain(); }
      else{ state.__tileErr[c.key]=msg; renderMain(); }
    }
  });
}

async function reload(){
  try{
    var hadAdmin = state && state.__adminLoaded;
    var pBoot = api({ action:"bootstrap", userId: profile.userId, asMember: previewMember?"1":"" });
    var pAdmin = hadAdmin ? api({ action:"adminData", userId: profile.userId, asMember: previewMember?"1":"" }) : null;
    var s = await pBoot;
    if(!s.ok) return fatal(s.error || "讀取失敗");
    if(pAdmin){
      var ad = await pAdmin;
      if(ad && ad.ok){ s.hcpList=ad.hcpList; s.memberFees=ad.memberFees; s.binding=ad.binding; s.balls=ad.balls; s.techList=ad.techList; s.seasonResetAllowed=ad.seasonResetAllowed; s.seasonResetLastMatch=ad.seasonResetLastMatch; s.teamNote=ad.teamNote; s.__adminLoaded=true; }
    }
    var prevMyStats = (state && state.myStats !== undefined) ? state.myStats : undefined;
    state = s;
    if(prevMyStats !== undefined) state.myStats = prevMyStats;   // 沿用上次,重新整理時不閃爍
    render();
    saveSnap();
    loadMyStats();           // 首屏畫好後再補抓「我的本年度」統計(不拖慢登入)
  }catch(e){
    fatal(e.message || "連線失敗,請確認 GAS_URL 設定並稍後再試。");
  }
}

// 展開管理員專區 → 抓一次管理員資料,抓到後就地重繪(保留已展開的區塊)
function loadAdminData(){
  if(!state || state.__adminLoaded || state.__adminLoading) return;
  // 快照秒開:上次管理資料(會員收款/送球庫存/綁定…)先套用,背景抓最新
  if(!state.__adminSnapUsed){
    state.__adminSnapUsed=true;
    var snap=tileSnapGet("adminData");
    if(snap){ applyAdminData_(snap); state.__adminStale=true; rerenderKeepOpen(); }
  }
  state.__adminLoading=true;
  api({ action:"adminData", userId: profile.userId, asMember: previewMember?"1":"" }).then(function(r){
    state.__adminLoading=false;
    if(r && r.ok){
      applyAdminData_(r);
      state.__adminLoaded=true; state.__adminStale=false;
      tileSnapPut("adminData", r);
      rerenderKeepOpen();
    }else{
      toast("⚠ 管理資料載入失敗("+((r&&r.error)||"連線失敗")+")"+(state.__adminStale?",先顯示上次資料":",請關閉頁面重開重試"));
      rerenderKeepOpen();
    }
  });
}
function applyAdminData_(r){
  state.hcpList=r.hcpList; state.memberFees=r.memberFees; state.binding=r.binding; state.balls=r.balls; state.techList=r.techList;
  state.seasonResetAllowed=r.seasonResetAllowed; state.seasonResetLastMatch=r.seasonResetLastMatch; state.teamNote=r.teamNote;

  renderMain();

function render(){
  window.__rendered=true;   // 看門狗:已畫出畫面,不再顯示「連線比平常久」
  if(!state.member){ return renderSetup(); }   // 還沒綁定全名
  renderMain();
  applyGotoParam();   // 深連結:?goto=頁面id → 開啟後直接跳到該頁(例 ?goto=season 年度總表)
}
// 分享深連結:liff.line.me/<LIFF_ID>?goto=season 之類;LIFF 轉址期間參數會包在 liff.state,兩處都解析
function gotoParam_(){
  try{
    var sp=new URLSearchParams(location.search);
    var g=sp.get("goto"); if(g) return g;
    var ls=sp.get("liff.state");
    if(ls){ var m=String(decodeURIComponent(ls)).match(/[?&]goto=([\w-]+)/); if(m) return m[1]; }
  }catch(e){}
  return "";
}
function applyGotoParam(){
  if(window.__gotoDone) return;
  var g=gotoParam_(); if(!g) return;
  var md=document.getElementById("tm_"+g); if(!md) return;   // 不存在的頁(或權限不足沒渲染)就靜靜略過
  window.__gotoDone=true;
  md.classList.remove("hidden");
  if(typeof TILE_API!=="undefined" && TILE_API[g]) openTileData(g);
  if(g==="season") loadSeasonResults();
  if((g==="proxy"||g==="balls") && typeof loadAdminData==="function") loadAdminData();
}

function renderMain(){
  var c=capNum();  var playing=state.roster.filter(function(r){return r.status!=="請假";});
  var leave=state.roster.filter(function(r){return r.status==="請假";});
  var total=playing.length;
  var confirmed=c>0?Math.min(total,c):total, waiting=c>0?Math.max(0,total-c):0;
  var left=c>0?Math.max(0,c-total):null, isFull=c>0&&total>=c;
  var mine=myRow();
  var iAmLeave=!!(mine&&mine.status==="請假");
  var iAmPlaying=!!(mine&&mine.status!=="請假");
  var myIdx=playing.indexOf(mine);
  var iAmWaiting=iAmPlaying&&c>0&&myIdx>=c;

  // 保留重繪前開著的方塊頁(重新整理/操作後不彈回首頁)
  var openTm=[]; document.querySelectorAll(".tmodal:not(.hidden)").forEach(function(m){ openTm.push(m.id); });

  app.innerHTML =
  previewBar()+
  '<div class="card">'+
    '<div class="masthead">'+flagSvg()+
      '<p class="eyebrow">'+teamLine()+(state.event.titleZh?' · '+esc(state.event.titleZh):'')+'</p>'+
      '<h1 class="title" style="font-size:29px">'+esc((ev().date||'').trim())+(ev().course?' · '+esc(courseShort(ev().course)):'')+'</h1>'+
    '</div>'+
    '<div class="meta">'+
      metaRow("球場",ev().course)+
      metaRow("開球",ev().tee,"tee")+
      '<div class="meta2">'+ metaRow("費用",ev().fee,"fee")+ '</div>'+   /* 名額欄位隱藏(cap 仍用於候補邏輯) */
      (function(){
        var dl=ev().deadline||'', left=deadlineLeft(dl);
        var main = left ? left.replace(/^·\s*/,'') : (dl||'—');   // 有天數 → 以天數為主
        var sub  = left && dl ? ' <span style="font-size:14px;color:var(--ink-soft);font-weight:400">('+esc(dl)+' 前)</span>' : '';
        var cls  = left ? 'color:var(--flag);' : '';
        return '<div class="meta-row"><div class="meta-k">截止</div><div class="meta-v"><span style="font-weight:400;'+cls+'">'+esc(main)+'</span>'+sub+'</div></div>';
      })()+
    '</div>'+
    '<div class="cardstat">'+
      '<div class="cs"><b>'+confirmed+'</b><span>參加</span></div>'+
      '<div class="cs"><b>'+leave.length+'</b><span>請假</span></div>'+
      (state.progress&&state.progress.members?'<div class="cs"><b>'+state.progress.notYet+'</b><span>尚未登記</span></div>':'')+
    '</div>'+
  '</div>'+
  (state.notices&&state.notices.event ? '<div class="notice event"><div class="nttl">📌 本場好康</div><div class="nbody">'+noticeHtml(state.notices.event)+'</div></div>' : '')+

  '<div class="mypanel">'+
    '<div class="myhead">'+ avatar() +
      '<div class="who"><b>'+gname(state.member.name)+'</b><small>｜'+identitySmall()+'｜差點 '+esc((state.myHcp&&state.myHcp!=="")?state.myHcp:"—")+'</small></div>'+
      '<span class="badge '+(iAmLeave?"leave":(iAmPlaying?"in":"out"))+'">'+(iAmLeave?"請假":(iAmPlaying?(iAmWaiting?"候補":"本場已登記參加"):"尚未登記"))+'</span>'+
    '</div>'+
    '<div class="mybody">'+
      (iAmLeave ? leavePanel() : (iAmPlaying ? registeredPanel(mine) : registerPanel(isFull)))+
    '</div>'+
  '</div>'+

  tilesGrid(total)+
  officersSection()+
  tileModals(playing,leave,total,c)+
  (state.isAdmin && total>0 ? attListModalHtml(playing) : '')+

  '<div class="footer">'+
    (!state.hasAdmin ? '<button id="claim">設我為管理員</button>' : '')+
    '<button id="reloadBtn">重新整理</button>'+
    (state.version ? '<div style="margin-top:8px;font-size:12.5px;color:var(--ink-soft);opacity:.6">'+esc(String(state.version).replace(/^v/,'').split(/[-+]/)[0])+'</div>' : '')+
  '</div>';

  // 還原重繪前開著的方塊頁
  openTm.forEach(function(id){ var m=document.getElementById(id); if(m) m.classList.remove("hidden"); });

  wireMain(isFull, iAmPlaying, iAmLeave);
}

// 球場短名(標題用):去掉「高爾夫球場/高爾夫俱樂部/球場/俱樂部」等字尾,最長取 4 字
function courseShort(c){
  var s=String(c||'').trim().replace(/(國際)?(高爾夫)?(鄉村)?(球場|俱樂部|球club)+$/,'').trim();
  if(!s) s=String(c||'').trim();
  return s.length>4 ? s.slice(0,4) : s;

// 截止倒數:「剩 N 天 / 今天截止」;解析不到或已過就回空字串
function deadlineLeft(dl){
  var m=String(dl||'').match(/(\d{1,2})\s*\/\s*(\d{1,2})/); if(!m) return '';
  var now=new Date(), y=now.getFullYear();
  var mo=parseInt(m[1],10), d=parseInt(m[2],10);
  if(mo<now.getMonth()+1-6) y+=1;                       // 跨年(12月看1月截止)
  var t=new Date(y,mo-1,d,23,59,59), days=Math.floor((t-now)/86400000);
  if(days<0||days>14) return '';
  return days===0 ? '· 今天截止' : ('· 剩 '+days+' 天');
}
// 距離本場例賽的天數(整數;今天=0,已過=負);解析不到回 null
function matchDaysLeft(){
  var ev=state.eventView||state.event||{};
  var m=String(ev.date||'').match(/(\d{1,2})\s*\/\s*(\d{1,2})/); if(!m) return null;
  var now=new Date(), y=now.getFullYear(), mo=parseInt(m[1],10), d=parseInt(m[2],10);
  if(mo<now.getMonth()+1-6) y+=1;                                   // 跨年
  var t=new Date(y,mo-1,d,23,59,59);
  return Math.floor((t-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);
}
// 本場出席名單是否已送球場 → {sent, date}(比對 state.rosterSent 的場次日期是否等於本場)
function rosterSentInfo(){
  var ev=state.eventView||state.event||{};
  var cur=String(ev.date||'').replace(/\(.*\)/,'').trim();
  var rs=String(state.rosterSent||'').split('|');
  var forDate=String(rs[0]||'').replace(/\(.*\)/,'').trim();
  if(cur && forDate===cur) return {sent:true, date:rs[1]||''};
  return {sent:false, date:''};
}

function buildRemindText(extra){
  var e=state.eventView||state.event||{};
  var playing=(state.roster||[]).filter(function(r){return r.status!=='請假';});
  var L=[];
  L.push('⛳【意象太極高爾夫球隊】賽前提醒');
  L.push('');
  if(e.date||e.course) L.push('🗓 '+(e.date||'')+(e.course?' · '+e.course:''));
  if(e.tee){
    // 集合時間(排在開球前):預設開球前 30 分鐘(產生後可在文字框直接改)
    var tm=String(e.tee).match(/^(\d{1,2}):(\d{2})/);
    if(tm){ var mins=parseInt(tm[1],10)*60+parseInt(tm[2],10)-30;
      L.push('⏰ 集合 '+Math.floor(mins/60)+':'+('0'+(mins%60)).slice(-2)); }
    L.push('🏌️ 開球 '+e.tee);
  }
  if(e.fee)  L.push('💰 費用 '+e.fee);
  L.push('👥 已報名 '+playing.length+' 人');
  // 已報名名單(來賓標示):直接接在人數後,方便球友確認自己有報到
  if(playing.length){
    var names=playing.map(function(p){
      var isGuest=(state.roleMap&&state.roleMap[p.name]==='來賓')||(p.userId&&p.userId.indexOf('G:')===0);
      return p.name+(isGuest?'(賓)':'');
    });
    L.push(names.join('、'));
  }
  var good=(state.notices&&state.notices.event)||'';
  if(good){ L.push(''); L.push('📣 本場好康'); L.push(good); }
  extra=String(extra||'').trim();
  if(extra){ L.push(''); L.push('🔔 特別提醒'); L.push(extra); }
  L.push('');
  L.push('👉 報名/查詢:https://liff.line.me/'+LIFF_ID);
  return L.join('\n');
}

function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){toast("✓ 已複製");},function(){fallbackCopy(t);});
  } else fallbackCopy(t);
}
function fallbackCopy(t){
  var ta=document.createElement("textarea"); ta.value=t;
  ta.style.position="fixed"; ta.style.top="0"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); toast("✓ 已複製"); }catch(e){ toast("複製失敗,請長按選取"); }
  document.body.removeChild(ta);
}
// 我的會費(含匯款資訊:只對「未繳」的會員顯示 + 一鍵複製帳號)
function myFeeSection(){
  if(!state.member) return '';
  if(state.roleMap && state.roleMap[state.member.name]==='來賓') return '';   // 來賓無年費
  var fee=state.myFee||'';
  if(fee===''||fee==="0") return '';
  var paid=!!state.myPaid;
  var bank=(state.notices&&state.notices.bank)||'';
  var html='<div class="section-label">我的會費'+(seasonLabel()?' '+esc(seasonLabel()):'')+'</div>'+
    '<div class="panel">'+
      '<div class="feeline"><span>本年度會費</span><b>NT$'+Number(fee).toLocaleString()+'</b></div>'+
      '<div class="feeline"><span>繳費狀態</span><b class="'+(paid?"paidok":"paidno")+'">'+(paid?"已繳":"未繳")+'</b></div>';
  if(!paid && bank){
    var acct=(bank.match(/\d[\d-]{5,}\d/g)||[]).sort(function(a,b){return b.replace(/\D/g,"").length-a.replace(/\D/g,"").length;})[0]||"";
    html+='<div class="bankbox"><div class="bankttl">💳 匯款資訊</div>'+
          '<div class="nbody">'+noticeHtml(bank)+'</div>'+
          '<button class="btn ghost sm copyBank" data-copy="'+esc(acct||bank)+'">'+(acct?"複製帳號":"複製匯款資訊")+'</button></div>';
  }
  return html+'</div>';
}

// 逐月記帳總表:最上方期初金額;列=月份(從帳務起始月起)、欄=收入+各費用類型+支出+餘額;末列合計。給財務長/管理員檢視。
function ledgerTableHtml(ld){
  var months=(ld&&ld.months)||[];
  if(!months.length) return '<div class="empty" style="padding:20px">尚無月份資料。</div>';
  var money=fmtMoney;
  var cell=function(n){ return n?money(n):'<span class="z">—</span>'; };
  var anyAddon=months.some(function(x){ return (x.addon||0)>0; });
  var cols=[['prize','獎金'],['purchase','點心水果']];
  if(anyAddon) cols.push(['addon','加碼']);
  cols.push(['meal','餐費'],['other','其他']);
  var tot={income:0}; cols.forEach(function(c){ tot[c[0]]=0; }); var totExp=0, lastBal=ld.startBalance||0;
  var body=months.map(function(x){
    tot.income+=(x.income||0);
    var tds=cols.map(function(c){
      tot[c[0]]+=(x[c[0]]||0);
      var extra=(c[0]==='other'&&x.otherNote)?'<i class="itn">'+esc(x.otherNote)+'</i>':'';   // 其他支出內容說明
      return '<td>'+cell(x[c[0]]||0)+extra+'</td>';
    }).join('');
    totExp+=(x.expense||0); lastBal=x.balance||0;
    // 收入格:總額 + 收入說明小字(#2 總覽也顯示)
    var incExtra=x.incomeNote?'<i class="itn">'+esc(x.incomeNote)+'</i>':'';
    return '<tr><th>'+x.mon+'月</th><td>'+cell(x.income||0)+incExtra+'</td>'+tds+'<td class="ex">'+money(x.expense||0)+'</td><td class="bal">'+money(x.balance||0)+'</td></tr>';
  }).join('');
  var head='<tr><th>月</th><th>收入</th>'+cols.map(function(c){ return '<th>'+c[1]+'</th>'; }).join('')+'<th>支出</th><th>餘額</th></tr>';
  var foot='<tr class="tf"><th>合計</th><td>'+cell(tot.income)+'</td>'+cols.map(function(c){ return '<td>'+cell(tot[c[0]])+'</td>'; }).join('')+'<td class="ex">'+money(totExp)+'</td><td class="bal">'+money(lastBal)+'</td></tr>';
  return '<div class="lgtop"><span>期初金額 <small style="color:var(--ink-soft)">(管理員設定)</small></span><b>'+money(ld.startBalance||0)+'</b></div>'+
    '<div class="lgtbl-wrap"><table class="lgtbl"><thead>'+head+'</thead><tbody>'+body+foot+'</tbody></table></div>'+
    '<button class="btn ghost sm" id="ledTblCopy" style="width:100%;margin-top:10px">📋 複製記帳總表<small>期初+逐月收支與餘額,可貼到 LINE 或報告</small></button>'+
    '<p class="formnote" style="text-align:left">合計列的「餘額」=最後一個月的期末餘額。數字為各月已儲存的收支;在「單月記帳」修改並儲存後,這裡會更新。</p>';
}
// 逐月記帳總表複製文字(期初+逐月收支+餘額)
function buildLedgerTableText(){
  var ld=state.ledger; if(!ld||!ld.months||!ld.months.length) return '';
  var money=fmtMoney;
  var anyAddon=ld.months.some(function(x){ return (x.addon||0)>0; });
  var L=['【意象太極高爾夫球隊 · 記帳總表】','','期初金額:'+money(ld.startBalance||0),''];
  var tot={income:0,prize:0,purchase:0,addon:0,meal:0,other:0,exp:0}, lastBal=ld.startBalance||0;
  ld.months.forEach(function(x){
    var parts=['獎金 '+money(x.prize||0),'點心水果 '+money(x.purchase||0)];
    if(anyAddon) parts.push('加碼 '+money(x.addon||0));
    parts.push('餐費 '+money(x.meal||0),'其他 '+money(x.other||0)+(x.otherNote?'('+x.otherNote+')':''));
    L.push(x.mon+'月:收入 '+money(x.income||0)+(x.incomeNote?'('+x.incomeNote+')':'')+'｜支出 '+money(x.expense||0)+'｜餘額 '+money(x.balance||0));
    L.push('  '+parts.join('｜'));
    tot.income+=(x.income||0); tot.prize+=(x.prize||0); tot.purchase+=(x.purchase||0); tot.addon+=(x.addon||0);
    tot.meal+=(x.meal||0); tot.other+=(x.other||0); tot.exp+=(x.expense||0); lastBal=x.balance||0;
  });
  var tparts=['獎金 '+money(tot.prize),'點心水果 '+money(tot.purchase)];
  if(anyAddon) tparts.push('加碼 '+money(tot.addon));
  tparts.push('餐費 '+money(tot.meal),'其他 '+money(tot.other));
  L.push(''); L.push('合計:收入 '+money(tot.income)+'｜支出 '+money(tot.exp)+'｜期末餘額 '+money(lastBal));
  L.push('  '+tparts.join('｜'));
  return L.join('\n');
}
// 產生「本月財務支出明細」複製文字(各類支出總計;讀畫面即時值,含未存的收入/餐費/其他/備註)
function buildLedgerText(){
  if(!state.ledger) return '';
  var sel=parseInt((document.getElementById("ledMon")||{}).value,10)||state.ledger.selMonth;
  var m=null; (state.ledger.months||[]).forEach(function(x){ if(x.mon===sel) m=x; });
  if(!m) return '';
  // 有輸入欄(可記帳)讀畫面即時值;檢視模式(會長)退回已儲存值
  var rd=function(id,fb){ var el=document.getElementById(id); return el?(parseFloat(el.value)||0):(fb||0); };
  var rs=function(id,fb){ var el=document.getElementById(id); return String(el?el.value:(fb||'')).trim(); };
  var feeInc=rd("ledFeeInc",m.feeInc), sponsorInc=rd("ledSponsorInc",m.sponsorInc), otherInc=rd("ledOtherInc",m.otherInc);
  var income=feeInc+sponsorInc+otherInc, meal=rd("ledMeal",m.meal), other=rd("ledOther",m.other);
  var otherNote=rs("ledOtherNote",m.otherNote), note=rs("ledNote",m.note), incomeNote=rs("ledIncomeNote",m.incomeNote);
  var expense=(m.prize||0)+(m.purchase||0)+(m.addon||0)+meal+other;
  var bal=(m.prev||0)+income-expense;
  var money=fmtMoney;
  var L=[];
  L.push("【意象太極高爾夫球隊 · "+sel+"月財務】");
  L.push("");
  L.push("前期餘額:"+money(m.prev||0));
  L.push("〔本月收入〕"+money(income));
  L.push("會費:"+money(feeInc)+"｜贊助:"+money(sponsorInc)+(otherInc>0?"｜其他:"+money(otherInc):"")+(incomeNote?"("+incomeNote+")":""));
  L.push("");
  L.push("〔本月支出〕");
  L.push("獎金:"+money(m.prize||0));
  L.push("點心/水果:"+money(m.purchase||0));
  if(m.addon) L.push("加碼獎:"+money(m.addon));
  L.push("餐費:"+money(meal));
  L.push("其他:"+money(other)+(otherNote?"("+otherNote+")":""));
  L.push("本期支出:"+money(expense));
  L.push("");
  L.push("本期餘額:"+money(bal));
  if(note){ L.push(""); L.push("備註:"+note); }
  return L.join("\n");
}

// 逐月採購總表:列=月份(從球季起始月排序,後端已排)、欄=四類別+合計+請款;點心/水果格附品項名
function purchaseTableHtml(pd){
  var byM=(pd&&pd.byMonth)||[];
  if(!byM.length) return '<div class="empty" style="padding:20px">尚無採購紀錄。</div>';
  var cats=['點心','水果','飲料','其他'], showItems={'點心':1,'水果':1};
  var cell=function(n,names){
    if(!n) return '<span class="z">—</span>';
    return fmtMoney(n)+(names&&names.length?'<i class="itn">'+esc(names.join('·'))+'</i>':'');
  };
  var tot={total:0,claim:0}; cats.forEach(function(c){ tot[c]=0; });
  var body=byM.map(function(x){
    var tds=cats.map(function(c){
      var v=(x.cats&&x.cats[c])||0; tot[c]+=v;
      return '<td>'+cell(v, showItems[c]&&x.items?x.items[c]:null)+'</td>';
    }).join('');
    tot.total+=(x.total||0); tot.claim+=(x.claim||0);
    return '<tr><th>'+x.mon+'月</th>'+tds+'<td class="ex">'+fmtMoney(x.total||0)+'</td><td>'+cell(x.claim||0)+'</td></tr>';
  }).join('');
  var head='<tr><th>月</th>'+cats.map(function(c){ return '<th>'+c+'</th>'; }).join('')+'<th>合計</th><th>請款</th></tr>';
  var foot='<tr class="tf"><th>合計</th>'+cats.map(function(c){ return '<td>'+cell(tot[c])+'</td>'; }).join('')+'<td class="ex">'+fmtMoney(tot.total)+'</td><td>'+cell(tot.claim)+'</td></tr>';
  return '<div class="lgtbl-wrap"><table class="lgtbl"><thead>'+head+'</thead><tbody>'+body+foot+'</tbody></table></div>'+
    '<p class="formnote" style="text-align:left">「合計」含總幹事自付招待;「請款」只算勾了請款的列(=帳務認列的球隊支出,與財務長「點心/水果」一致)。</p>';
}
function purRow(r,i,common){
  var cats=['點心','水果','飲料','其他'];
  var list=(common[r.cat]||[]);
  var dl='pur_dl_'+i;
  return '<div class="purrow" data-i="'+i+'">'+
    '<select class="pr-cat">'+cats.map(function(c){return '<option'+(c===r.cat?' selected':'')+'>'+c+'</option>';}).join('')+'</select>'+
    '<input class="pr-item" list="'+dl+'" value="'+esc(r.item||'')+'" placeholder="品項">'+
    '<datalist id="'+dl+'">'+list.map(function(x){return '<option value="'+esc(x)+'">';}).join('')+'</datalist>'+
    '<input class="pr-qty" inputmode="numeric" value="'+(r.qty||'')+'" placeholder="數量">'+
    '<input class="pr-amt" inputmode="numeric" value="'+(r.amt||'')+'" placeholder="金額">'+
    '<input type="checkbox" class="pr-claim"'+(r.claim?' checked':'')+'>'+
    '<button class="pr-del" title="刪除">✕</button>'+
  '</div>';
}

// 修改模式:用已存的技術獎帶入一列(得獎者預選),供「修改已輸入成績」使用
function techRowFilled(award,winner,tiao){
  var ao=TECH_OPTS.map(function(a){return '<option'+(a===award?' selected':'')+'>'+a+'</option>';}).join('');
  var isGuest=(award==="來賓獎");
  var names=isGuest?scoredGuestList():scoredNameList();
  if(winner && names.indexOf(winner)<0) names=names.concat([winner]);
  return '<div class="techrow"><select class="tr-award">'+ao+'</select>'+
         '<select class="tr-name">'+optionsHtml(names,winner)+'</select>'+
         '<input class="tr-tiao" value="'+esc(String(tiao||1))+'" inputmode="numeric"></div>';

function fillTechFromState(){
  var tc=(state.ranking&&state.ranking.tech)||[];

  if(tc.length) box.innerHTML=tc.map(function(x){return techRowFilled(x.award,x.winner,x.tiao);}).join('');

// 開啟成績表並帶入該場成績+技術獎(供「修改已輸入成績」用,僅管理員)
function openEditScores(){
  var m=document.getElementById("scoreModal");
  if(!m || !state.ranking) return;
  if(state.matchLocked){ toast("本場已鎖定,請先在月例賽成績區「🔓 解鎖」再修改"); return; }
  var di=document.getElementById("smDate"); if(di) di.value=state.ranking.date;
  var byName={}; (state.ranking.results||[]).forEach(function(r){ byName[r.name]=r; });
  document.querySelectorAll("#smBody tr[data-name]").forEach(function(tr){
    var r=byName[tr.getAttribute("data-name")];
    var oin=tr.querySelector(".sc-out"), iin=tr.querySelector(".sc-in");
    oin.value=(r&&r.out!=null&&r.out!=="")?r.out:"";
    iin.value=(r&&r.in!=null&&r.in!=="")?r.in:"";
    oin.dispatchEvent(new Event("input",{bubbles:true}));   // 重算總桿/淨桿 + 更新得獎者名單

}
// 當場已輸入成績(OUT+IN 都有)的會員 / 來賓
function scoredList(guest){
  var out=[];
  document.querySelectorAll("#smBody tr[data-name]").forEach(function(tr){
    var o=(tr.querySelector(".sc-out").value||"").trim();
    var i=(tr.querySelector(".sc-in").value||"").trim();
    if(o===""||i==="") return;
    var isGuest=tr.getAttribute("data-role")==="來賓";
    if(!!guest===isGuest) out.push(tr.getAttribute("data-name"));
  });
  return out;
}
function scoredNameList(){ return scoredList(false); }   // 會員
function scoredGuestList(){ return scoredList(true); }    // 來賓
function optionsHtml(names,selected){
  return '<option value="">選人</option>'+names.map(function(n){
    return '<option'+(n===selected?' selected':'')+'>'+esc(n)+'</option>';
  }).join('');
}
function techNameOptions(selected){ return optionsHtml(scoredNameList(),selected); }
function guestNameOptions(selected){ return optionsHtml(scoredGuestList(),selected); }
// 成績變動時:重建各列得獎者下拉(會員列=會員、來賓獎列=來賓),並自動同步來賓獎列
function refreshTech(){
  document.querySelectorAll("#smTechRows .techrow").forEach(function(row){
    var aw=row.querySelector(".tr-award"), nm=row.querySelector(".tr-name");
    if(!aw||!nm) return;
    var cur=nm.value;
    nm.innerHTML=(aw.value==="來賓獎")?guestNameOptions(cur):techNameOptions(cur);
  });
  syncGuestAwards();
}
// 有來賓且有成績 → 自動帶一列「來賓獎」並填入來賓名;來賓無成績則移除其自動列
function syncGuestAwards(){
  var guests=scoredGuestList();
  var box=document.getElementById("smTechRows"); if(!box) return;
  var have={};
  Array.prototype.slice.call(box.querySelectorAll('.techrow[data-auto-guest]')).forEach(function(row){
    var g=row.getAttribute('data-auto-guest');
    if(guests.indexOf(g)<0) row.parentNode.removeChild(row); else have[g]=true;
  });
  guests.forEach(function(g){
    if(have[g]) return;
    var div=document.createElement("div");
    div.className="techrow"; div.setAttribute('data-auto-guest', g);
    div.innerHTML=techRowInnerGuest(g);
    box.appendChild(div);
  });
}
function techRowsSeed(){
  var html='';
  TECH_SEED.forEach(function(s){ for(var i=0;i<s[1];i++) html+='<div class="techrow">'+techRowInner(s[0])+'</div>'; });
  return html;
}

function rankingSection(){

    if(state.scoreLocked) return '<div class="section-label">成績排名</div>'+
      '<div class="locked"><span class="lk">🔒</span><div><b>成績尚未開放</b><small>'+esc(state.scoreLocked)+'</small></div></div>';
    return "";
  }
  var rows=r.results.filter(function(x){return x.rankType!=="來賓";});

  var html='<div class="section-label">成績排名 · '+esc(r.date||"")+'</div>'+
    (state.isAdmin ? '<button class="btn ghost sm" id="editScore2" style="margin-bottom:10px"'+(state.matchLocked?' disabled':'')+'>✏️ 修改本場成績'+(state.matchLocked?'(已鎖定)':'')+'</button>' : '')+

  html+=rows.map(function(x){
    var awd="";
    if(x.rankType==="總桿") awd="總桿冠軍";

    else if(x.rankType==="逢五跳獎") awd="跳獎";
    else if(x.rankType==="BB") awd="BB獎";
    else if(x.rankType==="新會員") awd="新會員";
    else if(x.rankType==="淨桿") awd=(x.rank==="1"?"淨桿冠軍":x.rank==="2"?"淨桿亞軍":x.rank==="3"?"淨桿季軍":"");
    var me=(x.name===state.member.name);
    var newlyEst=(x.rankType==="新會員" && x.newHcp!=null && String(x.newHcp)!=="");   // 第二場剛建立差點
    var changed=(x.newHcp!=null && String(x.newHcp)!=="" && String(x.newHcp)!==String(x.hcp)) || newlyEst;   // 建立視同變動 → 同色標記
    var dash=function(v){ return (v===""||v==null)?"—":esc(v); };
    return '<div class="rankrow '+(me?"me ":"")+(x.rankType==="總桿"?"gross":"")+'">'+
      '<span class="rl">'+esc(awd)+'</span>'+
      '<span class="rn">'+gname(x.name)+(me?' <i>你</i>':'')+(x.rankType==="新會員"?' <small style="color:var(--ink-soft)">'+((x.hcp!==''&&x.hcp!=null)?'差點已建立·第3場起排名':'首場·待第2場')+'</small>':'')+'</span>'+
      '<span class="rc">'+esc(x.gross)+'</span>'+
      '<span class="rc">'+(newlyEst?"—":dash(x.hcp))+'</span>'+   /* 新會員第二場:賽前差點留白免誤會,新差點只在調後欄 */
      '<span class="rc">'+(x.rankType==="總桿"?"":dash(x.net))+'</span>'+   /* 總桿冠軍不比淨桿、差點不動 → 兩欄留白 */
      '<span class="rc2'+(changed?" up":"")+'">'+(x.rankType==="總桿"?"":dash(x.newHcp))+'</span>'+
    '</div>';
  }).join('');
  html+='</div>';   // /scorebox 桿數排名

      if(t.winner) grp[t.award].winners.push({name:t.winner, tiao:(t.tiao||0)});

      order.map(function(a){
        var g=grp[a];

        var cells=g.winners.map(function(w){
          return '<b style="white-space:nowrap;font-size:16.5px;font-weight:600">'+gname(w.name)+(w.tiao>1?' <small style="color:var(--flag);font-weight:700;font-size:13px">'+w.tiao+'</small>':'')+'</b>';
        }).join('');
        return '<div class="techrow" style="display:block">'+
          '<span class="ta">'+esc(a)+' <em>球'+g.tiao+'條</em></span>'+
          '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px 2px;text-align:center;margin-top:6px">'+cells+'</div>'+
        '</div>';
      }).join('')+
    '</div>';   // /scorebox 技術獎
  }
  // 年度總桿冠軍榮譽榜(隨成績快照帶入;技術獎下方,3 欄網格對齊;字級統一 16.5)
  if(r.roll && r.roll.length){
    html+='<div class="scorebox"><div class="boxtitle">年度總桿冠軍榮譽榜</div>'+
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px 2px;text-align:center;padding:8px 2px 6px;border-top:1px solid var(--line)">'+
      r.roll.map(function(c){
        var mo=parseInt(String(c.date).split('/')[0],10)||'';
        return '<b style="white-space:nowrap;font-size:16.5px;font-weight:600">♔ '+gname(c.name)+' <small style="color:var(--gold);font-weight:700;font-size:13px">'+mo+'月</small></b>';
      }).join('')+
      '</div></div>';
  }
  var par=esc(state.event.par||"標準桿");
  html+='<details class="hcpinfo"><summary>差點調整方式說明</summary>'+
    '<div class="hcpinfo-body">'+

// 當月出席名單純文字(傳給球隊/球場用):球隊名稱(第X屆)/日期/球場/開球 + 編號名單 + 請假
function buildAttText(playing){
  var ev=state.eventView||{}, e=state.event||{};
  var team=(e.teamName||'').trim() || '意象太極高爾夫球隊';   // 確保一定有隊名(沒設定時用預設)
  var head=team + (e.term ? ' 第'+e.term+'屆' : '');
  var date=ev.date||e.date||"";
  var course=ev.course||e.course||"";
  var tee=ev.tee||e.tee||"";
  var L=[];
  L.push(head);                          // 隊名固定放第一行
  if(date) L.push("日期:"+date);
  if(course) L.push("球場:"+course);
  if(tee) L.push("開球時間:"+tee);
  var dine=0, noDine=0;
  playing.forEach(function(p){ if(p.cart==="不用餐") noDine++; else dine++; });
  L.push("");
  L.push("出席名單(共 "+playing.length+" 人):");
  L.push("用餐 "+dine+" 人 · 不用餐 "+noDine+" 人");
  playing.forEach(function(p,i){
    var isGuest=(p.userId && p.userId.indexOf("G:")===0) || (state.roleMap && state.roleMap[p.name]==="來賓");
    var isProxy=(p.userId && p.userId.indexOf("M:")===0);
    L.push((i+1)+". "+p.name+(isGuest?"(來賓)":(isProxy?"(代)":"")));
  });
  var sec=(e.secretary||'').trim();
  L.push("");
  L.push("承辦:總幹事 "+(sec||'張凌華')+" "+((state.event&&state.event.secretaryPhone)||'0905361633'));
  return L.join("\n");
}

function scheduleSection(){
  var s=state.schedule;
  if(!s || !s.length) return "";
  var todayKey=state.todayKey||(function(){var d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();})();
  var ny=Math.floor(todayKey/10000), nm=Math.floor(todayKey/100)%100, nowIdx=ny*12+(nm-1);
  var up=s.filter(function(e){
    if(e.sortKey<todayKey) return false;
    var ey=parseInt(e.year,10)||ny, em=parseInt(e.month,10)||nm;
    return (ey*12+(em-1)) <= nowIdx+2;          // 本月起未來兩個月內
  });
  var nextSort=up.length?up[0].sortKey:-1;
  var html='<div class="section-label">近期賽程</div>';
  html+= up.length
    ? up.map(function(e){return schItem(e, e.sortKey===nextSort, false);}).join('')
    : '<div class="empty">近期暫無例賽。</div>';
  html+='<button class="btn ghost sm" id="openSched" style="margin-top:8px;width:100%">看整年度賽程</button>';
  html+= scheduleModalHtml();
  if(state.isAdmin) html+='<div class="ranknote">編輯/新增/刪除請到試算表「行事曆」分頁;預約提醒會自動更新。</div>';
  return html;
}
function scheduleModalHtml(){
  var s=state.schedule||[], todayKey=state.todayKey||0;
  var nextSort=-1; for(var i=0;i<s.length;i++){ if(s[i].sortKey>=todayKey){ nextSort=s[i].sortKey; break; } }
  var rows=s.map(function(e){return schItem(e, e.sortKey===nextSort, e.sortKey<todayKey);}).join('');
  return '<div id="schedModal" class="modal hidden"><div class="modal-card full">'+
    '<div class="modal-head"><span>整年度賽程'+(seasonLabel()?' '+esc(seasonLabel()):'')+'</span><button class="mclose" id="schedClose">✕</button></div>'+
    '<div class="sctab-wrap" style="padding:4px">'+rows+'</div>'+
  '</div></div>';
}

      }
    });
    // BIRDIE獎 = Birdie 欄 + 手動列 合併,每人最多 2 條
    var birdieAll={};
    Object.keys(birdieOf).forEach(function(n){ birdieAll[n]=(birdieAll[n]||0)+birdieOf[n]; });
    Object.keys(birdieManual).forEach(function(n){ birdieAll[n]=(birdieAll[n]||0)+birdieManual[n]; });
    Object.keys(birdieAll).forEach(function(n){
      var t=Math.min(birdieAll[n],2);                      // 每人最多領 2 個 birdie 獎
      if(t>0) techLines.push("BIRDIE獎 "+n+" "+t);
    });
    if(state.matchLocked && state.matchLockDate===d){ toast("本場成績已鎖定,請先在下方「🔓 解鎖」再編輯"); return; }
    var resubmit = !!(state.ranking && state.ranking.date===d);
    var msg = resubmit
      ? ("「"+d+"」已有成績,將【覆蓋並重新計算差點】(不會重覆扣)。確定送出?")
      : ("送出 "+lines.length+" 筆成績"+(techLines.length?(" + "+techLines.length+" 筆技術獎"):"")+"("+d+"),計算排名並更新差點?");
    if(!confirm(msg)) return;
    busy("smSubmit","計算中…");
    api({action:"submitMatch",userId:profile.userId,date:d,text:lines.join("\n"),tech:techLines.join("\n"),dnf:dnf.join("\n")}).then(function(r){
      if(!r.ok){ toast(r.error||"更新失敗"); var b=document.getElementById("smSubmit"); if(b){b.disabled=false;b.textContent="送出(成績+技術獎)";} return; }
      state.ledger=null; tileSnapDel("ledger");         // 成績改變 → 帳務「本月獎金」變,清快照重抓
      state.seasonResults=null;                          // 逐場成績/年度總表重抓(本場結果變了)
      invalidateAdminData();                             // 送球庫存(技術獎球數)重抓
      toast("已計算 "+r.count+" 筆成績"+(r.techAdded?(",技術獎 "+r.techAdded+" 筆"):""));
      var inp=document.getElementById("smInput"); if(inp) inp.classList.add("hidden");
      var sf=document.getElementById("smSubmitFoot"); if(sf) sf.classList.add("hidden");
      var ttl=document.getElementById("smTitle"); if(ttl) ttl.textContent="計算結果 "+r.ranking.date;
      var res=document.getElementById("smResult");
      if(res){ res.classList.remove("hidden"); res.innerHTML=scoreResultHtml(r.ranking);
        var done=document.getElementById("smDone");
        if(done) done.onclick=function(){ var m=document.getElementById("scoreModal"); if(m) m.classList.add("hidden"); reload(); };
        var ex=document.getElementById("smExportPdf");
        if(ex) ex.onclick=function(){
          var d=ex.dataset.date||"";
          busy("smExportPdf","產生中…");
          api({action:"exportPdf",userId:profile.userId,date:d,folder:(state.event.pdfFolder||"")}).then(function(rr){
            var b=document.getElementById("smExportPdf"); if(b){b.disabled=false;b.textContent="📄 匯出 PDF";}
            if(!rr.ok){ toast(rr.error||"匯出失敗"); return; }
            toast("已存到「"+rr.folder+"」");
            var box=document.getElementById("smPdfLink");
            if(box) box.innerHTML='<a class="btn sm" style="margin:4px 0 0;display:block;text-align:center;text-decoration:none" href="'+rr.url+'" target="_blank" rel="noopener">開啟 PDF('+esc(rr.date)+')</a>';
            try{ if(window.liff&&liff.openWindow){ liff.openWindow({url:rr.url,external:true}); } else { window.open(rr.url,"_blank"); } }catch(e){}
          }).catch(function(){ toast("連線失敗"); var b=document.getElementById("smExportPdf"); if(b){b.disabled=false;b.textContent="📄 匯出 PDF";} });
        };
      }
    }).catch(function(){ toast("連線失敗"); var b=document.getElementById("smSubmit"); if(b){b.disabled=false;b.textContent="送出(成績+技術獎)";} });
  };
  var sr=document.getElementById("seasonReset");
  if(sr) sr.onclick=function(){
    var f=((state.event&&state.event.hcpResetFactor)||"0.85");
    if(!confirm("年初重設:用本年度區間的成績,把每位會員的年初差點重算為「(平均總桿−標準桿)×"+f+"」(倍率取自 Config),並把會費收款歸零?建議只在新年度開始時做一次。")) return;
    busy("seasonReset","重算中…");
    api({action:"seasonReset",userId:profile.userId}).then(function(r){
      toast(r.ok?("已重算 "+r.reset+" 人差點(×"+r.factor+")"+(r.kept?","+r.kept+" 人無成績維持原值":"")):(r.error||"重設失敗")); reload();
    });
  };
  var paySync=document.getElementById("paySync");
  if(paySync) paySync.onclick=function(){
    busy("paySync","處理中…");
    api({action:"ensurePayList",userId:profile.userId}).then(function(r){
      if(r && r.ok){ toast("✓ 已列入 "+r.count+" 位會員,可到試算表 Payments 分頁打 v"); setTimeout(reload,600); }
      else { var b=document.getElementById("paySync"); if(b){b.disabled=false;b.textContent="把目前會員列入 Payments 分頁";} toast((r&&r.error)||"處理失敗"); }
    });
  };
  var bs=document.getElementById("buildSeason");
  if(bs) bs.onclick=function(){
    busy("buildSeason","產生中…");
    api({action:"buildSeason",userId:profile.userId}).then(function(r){
      toast(r.ok?("已產生年總表("+r.members+"人 × "+r.months+"場),請到試算表「年總表」分頁查看"):(r.error||"產生失敗"));
      reload();
    });
  };
  var bsc=document.getElementById("buildSchedule");
  if(bsc) bsc.onclick=function(){
    busy("buildSchedule","建立中…");
    api({action:"buildSchedule",userId:profile.userId}).then(function(r){
      toast(r.ok?(r.existed?"行事曆已存在,未覆蓋你的編輯":"已建立行事曆,共 "+r.rows+" 場,請到試算表「行事曆」分頁編輯"):(r.error||"建立失敗"));
      reload();
    });
  };
  var claim=document.getElementById("claim");
  if(claim) claim.onclick=function(){
    if(!confirm("把自己設為管理員?設定後只有你能修改活動資訊與清空名單。")) return;
    api({action:"claimAdmin",userId:profile.userId}).then(function(r){
      toast(r.ok?"你已成為管理員":(r.error||"設定失敗")); reload();
    });
  };
  var rl=document.getElementById("reloadBtn");
  if(rl) rl.onclick=reload;
}

function after(msg){
  return function(r){
    if(r && r.ok===false){ toast("⚠ "+(r.error||"操作失敗,請再試一次")); reload(); }
    else { toast("✓ "+msg); reload(); }
  };
}
// 出席相關動作:後端已回傳最新名單+進度 → 就地更新即可,免再跑一次 bootstrap(省一趟往返)
function afterRoster(msg){
  return function(r){
    if(!r || r.ok===false){ toast("⚠ "+((r&&r.error)||"操作失敗,請再試一次")); return reload(); }
    toast("✓ "+msg);
    if(state && r.roster){ state.roster = r.roster; if(r.progress) state.progress = r.progress; rerenderKeepOpen ? rerenderKeepOpen() : render(); }
    else { reload(); }
  };
}
function val(id){var el=document.getElementById(id);return el?el.value:"";}
function busy(id,txt){var b=document.getElementById(id);if(b){if(!b.dataset.orig)b.dataset.orig=b.textContent;b.disabled=true;b.textContent=txt;}}
// 設定類儲存(收集所有 .adm 欄位):按鈕會顯示「儲存中…→✓ 已儲存」,失敗會還原並提示
function saveAdm(btnId, okMsg){
  var b=document.getElementById(btnId);
  var orig=b?(b.dataset.orig||b.textContent):"";
  if(b){b.dataset.orig=orig;b.disabled=true;b.textContent="儲存中…";}
  var p={action:"updateEvent",userId:profile.userId};
  document.querySelectorAll(".adm").forEach(function(el){p[el.dataset.k]=el.value;});
  api(p).then(function(r){
    if(r && r.ok===false){
      if(b){b.disabled=false;b.textContent=orig;}
      toast("⚠ "+(r.error||"儲存失敗,請再試一次"));
    }else{
      if(b){b.textContent="✓ 已儲存";}
      toast("✓ "+okMsg);
      setTimeout(reload,800);
    }
  });
}

var toastTimer;
function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove("show");},2200);
}
</script>
</body>
</html>
